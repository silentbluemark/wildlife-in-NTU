<style>

button,select,input{font:inherit;color:inherit}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
.btn.p{background:var(--g);color:#fff;border-color:var(--g)}.btn.on{background:var(--am);color:#fff;border-color:var(--am)}
header .btn{background:#ffffff26;color:#fff;border-color:#ffffff55;min-height:36px}

.badges{display:flex;flex-wrap:wrap;gap:6px}.bd{border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:13px;opacity:.55}.bd.u{opacity:1;border-color:var(--am);color:var(--am);font-weight:600}
.two{display:grid;gap:12px}@media(min-width:1024px){.two{grid-template-columns:1fr 1fr}}
.fl{display:grid;gap:8px;grid-template-columns:1fr 1fr}@media(min-width:1024px){.fl{grid-template-columns:repeat(5,1fr)}}

.fl .s{grid-column:1/-1}@media(min-width:1024px){.fl .s{grid-column:auto}}

</style></head><body><div class="w">
<header><h1>🌿 臺大生態尋寶圖 <small style="font-size:13px;opacity:.85">NTU Eco-Hunter</small></h1>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b id="title"></b><span id="cnt"></span><button class="btn" onclick="resetAll()">重置紀錄</button></div>
<div class="bar"><i id="pb"></i></div></header>

<section><h2>🏅 成就徽章</h2><div class="badges" id="badges"></div>
<div style="margin-top:10px"><button class="btn" id="silBtn" onclick="toggleSil()"></button> <span class="m">開啟後未尋獲物種以剪影與謎語呈現</span></div></section>

<div class="two">
<section><h2>🗺️ 校園生態地圖 <span class="m">（示意圖，非精確比例）</span></h2>
<svg viewBox="0 0 400 250" width="100%" role="group" aria-label="校園分區地圖"><rect width="400" height="250" rx="10" fill="#e7f5ea"/>
<g id="zones"></g></svg>
<button class="btn" style="width:100%;margin-top:6px" id="z5b" onclick="pickZone('zone-5')"></button></section>
<section><h2>📍 GPS 地理圍欄打卡</h2>
<label><input type="checkbox" id="gps" onchange="gpsChg()"> 啟用定位驗證打卡</label><br>
<label><input type="checkbox" id="test"> 測試模式（略過定位）</label>
<p class="m">定位資料僅在裝置端比對，不會上傳。座標與半徑為概略設定，未經實地測量。取消打卡不需定位。</p>
<div id="gmsg" class="m"></div></section></div>

<section><div class="fl">
<select id="fm" onchange="draw()"></select><select id="fz" onchange="draw()"></select>
<select id="fc" onchange="draw()"><option value="">全部分類</option><option>鳥類</option><option>兩棲爬蟲</option><option>哺乳與魚類</option><option>昆蟲</option></select>
<select id="fs" onchange="draw()"><option value="">全部狀態</option><option value="y">已尋獲</option><option value="n">未尋獲</option></select>
<input class="s" id="q" placeholder="搜尋名稱、俗稱、習性（如 大笨鳥、蚯蚓）" oninput="draw()"></div></section>

<div id="grid" class="grid" style="margin-top:12px"></div>
<p class="ft">紀錄僅存於此瀏覽器。活躍月份、稀有度與謎語為一般知識自行擬定，尚待生態專家審查。</p></div>
<div id="toast"></div>

function ic(s){const p=IP[s.id];if(!p)return NB[s.id]?`<svg width="68" height="68" viewBox="0 0 64 64" aria-hidden="true">${NB[s.id]}</svg>`:s.em;const L=p.long,hx=46,hy=L?12:22;
return `<svg width="68" height="68" viewBox="0 0 64 64" aria-hidden="true" stroke="${p.st||'none'}" stroke-width="1"><path d="M20 36L3 44L22 45Z" fill="${p.b}"/><path d="M28 47V58M35 47V58" stroke="${p.lg}" stroke-width="2.5" stroke-linecap="round"/>${p.ft||''}<ellipse cx="31" cy="38" rx="17" ry="11" fill="${p.b}"/><ellipse cx="34" cy="43" rx="11" ry="6" fill="${p.bl}"/>${L?`<path d="M40 32Q32 20 ${hx} ${hy}" stroke="${p.h}" stroke-width="6" stroke-linecap="round" fill="none"/>`:`<path d="M38 33L40 22H50L46 36Z" fill="${p.h}"/>`}<circle cx="${hx}" cy="${hy}" r="7.5" fill="${p.h}"/>${p.x||''}<path d="${L?'M52 10L63 14L52 16':'M51 20L61 24L51 27'}Z" fill="${p.bk}"/><circle cx="${hx+2}" cy="${hy-1}" r="1.7" fill="${p.e||'#111'}" stroke="none"/></svg>`}
function card(s){const f=!!S.f[s.id],hid=sil&&!f&&!S.rv[s.id];const mt=s.m?s.m.replace('-','–')+' 月':'全年';
const snd=[1,9,14].includes(s.id)?`<button class="btn" onclick="snd(${s.id})">🔊 聽聽叫聲（示意音效）</button>`:'';
return `<div class="c ${f?'f':''}"><div class="ph ${hid?'sil':''}" role="img" aria-label="${hid?'剪影':s.cat+'圖示'}">${ic(s)}</div><div class="cb">
<h3>${hid?'？？？':s.name} ${f?'<span class="tg" style="color:var(--am);border-color:var(--am)">✅ 已尋獲</span>':''}</h3>
<div><span class="tg r${s.rar}">${RN[s.rar]} ${'★'.repeat(s.rar)}</span> <span class="tg">${hid?'？':s.cat}</span> <span class="tg">📅 ${mt}</span></div>
${hid?`<div class="m">🧩 ${s.rid}</div><div class="gi"><input id="g${s.id}" placeholder="輸入名稱或俗稱" onkeydown="if(event.key=='Enter')guess(${s.id})"><button class="btn p" style="min-height:40px" onclick="guess(${s.id})">作答</button></div><button class="btn" onclick="giveUp(${s.id})">放棄，看答案</button>`
:`${s.alias?`<div class="m">俗稱：${s.alias}</div>`:''}<div class="m">📍 ${Z[s.zone][0]}</div><div class="m">${s.desc}${s.note}</div>`}
${s.alert?`<div class="al">⚠️ ${s.alert}</div>`:''}
<div class="row">${snd}${hid?'':`<a class="btn" style="display:grid;place-items:center;text-decoration:none" target="_blank" rel="noopener noreferrer" href="${wiki(s.name)}">📖 維基百科</a>`}<button class="btn ${f?'':'p'}" onclick="chk(${s.id})">${f?'取消尋獲':'標記尋獲'}</button></div></div></div>`}
function clr(){$('fz').value='';$('fc').value='';$('fs').value='';$('fm').value=0;$('q').value='';draw()}
function mark(id){S.f[id]=1;S.rv[id]=S.rv[id]||'f';save();confetti(24);checkBadges();draw()}
function chk(id){if(S.f[id]){delete S.f[id];if(S.rv[id]=='f')delete S.rv[id];save();draw();return}
if(!$('gps').checked||$('test').checked){mark(id);return}
const s=D[id-1],z=Z[s.zone],g=$('gmsg');if(!navigator.geolocation){g.textContent='❌ 此裝置不支援定位，請改用測試模式。';return}
g.textContent='定位中…';navigator.geolocation.getCurrentPosition(p=>{const d=hav(p.coords.latitude,p.coords.longitude,z[1],z[2]);
if(d<=z[3]){g.textContent='✅ 位於範圍內（距中心 '+Math.round(d)+' 公尺）';mark(id)}else g.textContent=`📍 你距「${z[0]}」中心約 ${Math.round(d)} 公尺，需在 ${z[3]} 公尺內才能打卡。`},
e=>g.textContent=(e.code==1?'❌ 定位權限被拒絕':'❌ 無法取得定位')+'，請改用測試模式。',{enableHighAccuracy:true,timeout:10000})}
function hav(a,b,c,d){const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742000*Math.asin(Math.sqrt(h))}
function gpsChg(){$('gmsg').textContent=$('gps').checked?'已啟用定位驗證。':''}
function guess(id){const s=D[id-1],v=$('g'+id).value.trim();if(!v)return;if(v==s.name||s.alias.split('、').includes(v)){S.rv[id]='s';save();confetti(40);toast('🎉 答對了！是'+s.name);checkBadges();draw()}else toast('再想想看～')}
function giveUp(id){S.rv[id]='g';save();draw()}
function toggleSil(){sil=!sil;save();draw()}
function resetAll(){if(!confirm('確定要重置嗎？這會清除所有尋獲、猜謎進度與徽章。'))return;S.f={};S.rv={};S.bd={};save();checkBadges(true);draw();toast('已重置紀錄')}
let ac;function snd(id){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=ac||new C();const pat={1:[[110,0,.5,'sine'],[100,.7,.5,'sine']],9:[[500,0,.12,'sawtooth'],[450,.2,.12,'sawtooth'],[500,.4,.12,'sawtooth'],[420,.6,.2,'sawtooth']],14:[[700,0,.08,'square'],[700,.25,.08,'square'],[700,.5,.08,'square'],[700,.75,.08,'square']]}[id];
pat.forEach(([f,t,d,w])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=w;o.frequency.value=f;g.gain.setValueAtTime(.001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.15,ac.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d+.05)});toast('🔊 合成示意音效，非實際叫聲')}
$('fm').innerHTML='<option value="0">所有月份</option>'+[...Array(12)].map((_,i)=>`<option value="${i+1}">${i+1} 月</option>`).join('');$('fm').value=new Date().getMonth()+1;
$('fz').innerHTML='<option value="">全校園區域</option>'+Object.entries(Z).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');
checkBadges(true);draw();
</script></body></html>
